# Only releases a week old, as Dependabot's cooldown; exact versions, as uv.lock pins them.
minimumReleaseAge: 10080
savePrefix: ""
engineStrict: true
# jsx-a11y hasn't widened its range, and runs on ESLint 10's flat config.
# The AG-UI client's zod 3 reaches generative-ui, whose schemas load on it; we render no generative UI.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"
    "@assistant-ui/generative-ui>zod": "3"
