# Only releases a week old, as Dependabot's cooldown; exact versions, as uv.lock pins them.
minimumReleaseAge: 10080
savePrefix: ""
engineStrict: true
# mise installs the pnpm packageManager names; skipping pnpm's own check keeps the lockfile one document, which GitHub reads (ADR-0010).
pmOnFail: ignore
# jsx-a11y hasn't widened its range, and runs on ESLint 10's flat config.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"
# They ask for zod 3 but import only zod/v4, so they share the app's zod 4 and its jitless setting (src/zod.ts).
overrides:
  "@ag-ui/client>zod": $zod
  "@ag-ui/proto>zod": $zod
