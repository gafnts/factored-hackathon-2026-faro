[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13,<0.14" ]

[project]
name = "faro"
version = "0.1.0"
description = "Faro, a card support agent in Spanish and Portuguese, built for the Factored AI & Data Hackathon 2026"
readme = "README.md"
license = "MIT"
requires-python = "~=3.13.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "boto3[crt]>=1.43.103",
  "duckdb>=1.5.5",
  "jsonschema>=4.26",
  "rfc3339-validator>=0.1.4",
]

[dependency-groups]
dev = [
  "boto3-stubs[cognito-idp,dynamodb,logs,s3,secretsmanager,sts]>=1.43.118",
  "moto[dynamodb,s3]>=5.2.3",
  "mypy>=2.3.1",
  "playwright>=1.63",
  "pre-commit>=4.6.2",
  "pyproject-fmt>=2.29.4",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-timeout>=2.4",
  "pytest-xdist>=3.8",
  "ruff>=0.16.9",
  "shellcheck-py>=0.11.0.1",
  "types-jsonschema>=4.26.0.20260518",
]
agent = [
  "ag-ui-langgraph>=0.0.45",
  "ag-ui-protocol>=1",
  "bedrock-agentcore>=1.23.1",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "jsonschema>=4.26",
  "langchain>=1.4.2",
  "langchain-anthropic>=1.7.4",
  "langgraph>=1.2.12",
  "langgraph-checkpoint-aws>=1.2.3",
  "rfc3339-validator>=0.1.4",
]
eda = [
  "matplotlib>=3.11.2",
  "plotnine>=0.15.8",
  "polars>=1.44.2",
  "pyarrow>=25.0.1",
  "scikit-learn>=1.9.1",
]
pipeline = [
  "dbt-core>=1.12.5",
  "dbt-duckdb>=1.11",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12",
]
tools = [
  "boto3>=1.43.103",
  "jsonschema>=4.26",
  "rfc3339-validator>=0.1.4",
]

[tool.uv]
required-version = ">=0.13"
default-groups = [ "agent", "dev", "eda", "pipeline", "tools" ]
exclude-newer = "1 week"

[tool.ruff]
src = [ "src" ]
lint.select = [ "B", "E4", "E7", "E9", "F", "G", "I", "N", "SIM", "UP" ]

[tool.mypy]
mypy_path = "src"
files = [ "src", "tests" ]
strict = true
overrides = [
  { module = "tests.*", disallow_untyped_defs = false },
  { module = "sklearn.*", ignore_missing_imports = true },
  { module = [ "ag_ui_langgraph.*", "langgraph_checkpoint_aws.*" ], ignore_missing_imports = true },
  { module = [
    "faro.analysis.cards_figures",
    "faro.analysis.figures",
    "faro.analysis.plotting",
    "faro.analysis.traffic_figures",
  ], disallow_untyped_calls = false },
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-m 'not integration and not regression' --dist=loadgroup"
ini_options.markers = [
  "browser: plays the chat in Chromium against the deployed site (make browser)",
  "integration: requires credentials and network access (deselected by default)",
  "regression: plays and grades the regression set's composition on the bank (make regression; deselected by default)",
  "slow: waits out a token's lifetime, so make integration runs it only with SLOW=1",
]
ini_options.timeout = 120

[tool.coverage]
run.source = [ "src" ]
run.branch = true
report.fail_under = 80
report.show_missing = true
