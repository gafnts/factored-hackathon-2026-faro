# Written by `python -m faro.pipeline contracts` from the data dictionary (src/faro/analysis/catalog.py)
# and contracts/corrections.yml. Don't edit it by hand.
sources:
  - name: snapshot
    description: "The pinned snapshot's files (ADR-0002), each read with its table's contract."
    config:
      meta:
        root: "{{ var('snapshot_root') }}"
        formatter: template
    tables:
      - name: branches
        description: One file, branches.csv; keyed by branch_id.
        config:
          meta:
            external_location: "read_csv('$root/branches.csv', columns = {'branch_id': 'VARCHAR', 'branch_code': 'VARCHAR', 'branch_name': 'VARCHAR', 'branch_type': 'VARCHAR', 'address': 'VARCHAR', 'city': 'VARCHAR', 'state': 'VARCHAR', 'country': 'VARCHAR', 'postal_code': 'VARCHAR', 'geographic_zone': 'VARCHAR', 'phone': 'VARCHAR', 'email': 'VARCHAR', 'opening_time': 'TIME', 'closing_time': 'TIME', 'has_atms': 'BOOLEAN', 'atm_count': 'INTEGER', 'has_teller_windows': 'BOOLEAN', 'teller_window_count': 'INTEGER', 'latitude': 'DECIMAL(10,7)', 'longitude': 'DECIMAL(10,7)', 'branch_opening_date': 'DATE', 'branch_status': 'VARCHAR'}, header = true, auto_detect = false, delim = ',', quote = '\"', escape = '\"', strict_mode = true, hive_partitioning = false, filename = true)"
        columns:
          - name: branch_id
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(20) NOT NULL.'
            config:
              meta:
                personal_data: none
          - name: branch_code
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(10) NOT NULL.'
            config:
              meta:
                personal_data: none
          - name: branch_name
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(100) NOT NULL.'
            config:
              meta:
                personal_data: none
          - name: branch_type
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(30) NOT NULL IN (Main, Express, Premium, Corporate).'
            config:
              meta:
                personal_data: none
          - name: address
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(200) NOT NULL.'
            config:
              meta:
                personal_data: none
          - name: city
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(100) NOT NULL.'
            config:
              meta:
                personal_data: none
          - name: state
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(100) NOT NULL.'
            config:
              meta:
                personal_data: none
          - name: country
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(50) NOT NULL IN (Mexico, Colombia, Argentina). Corrected: Every Mexican branch is spelled México, with its accent (175 rows).'
            config:
              meta:
                personal_data: none
          - name: postal_code
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(10).'
            config:
              meta:
                personal_data: none
          - name: geographic_zone
            data_type: VARCHAR
            description: "Dictionary: VARCHAR(50) NOT NULL IN (Urban, Suburban, Rural). Corrected: Every branch's zone is Urbana, in Spanish (350 rows), which the dictionary doesn't list."
