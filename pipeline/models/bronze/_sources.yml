              meta:
                personal_data: none
          - name: phone
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(20) NOT NULL.'
            config:
              meta:
                personal_data: none
          - name: email
            data_type: VARCHAR
            description: 'Dictionary: VARCHAR(100).'
            config:
              meta:
                personal_data: none
          - name: opening_time
            data_type: TIME
            description: 'Dictionary: TIME NOT NULL.'
            config:
              meta:
                personal_data: none
          - name: closing_time
            data_type: TIME
            description: 'Dictionary: TIME NOT NULL.'
            config:
              meta:
                personal_data: none
          - name: has_atms
            data_type: BOOLEAN
            description: 'Dictionary: BOOLEAN NOT NULL.'
            config:
              meta:
