# Into develop, the default branch. Version updates come monthly, grouped by what a
# merge touches, with majors apart so they never hold up the rest. The cooldown skips
# releases younger than a week; security updates ignore it. Not covered: the
# Terraform CLI, Python, Node, and the tool versions in the workflows' env blocks.

version: 2

multi-ecosystem-groups:
  ci:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: ci
    cooldown:
      default-days: 7

  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: ci
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 14
    # They define the pipeline's version, which the published exports record.
    ignore:
      - dependency-name: duckdb
      - dependency-name: dbt-*
    groups:
      python-runtime:
        patterns:
          - ag-ui-*
          - bedrock-agentcore
          - boto3*
          - fastapi
          - httpx
          - jsonschema
          - langchain*
          - langgraph*
          - rfc3339-validator
        update-types: [minor, patch]
      python-tooling:
        patterns: ["*"]
        update-types: [minor, patch]
      python-major:
        patterns: ["*"]
        update-types: [major]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      web-app:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      web-tooling:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
      web-major:
        patterns: ["*"]
        update-types: [major]
      web-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: [/infra, /infra/iam]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]
