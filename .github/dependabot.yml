# Into develop, the default branch. Version updates come quarterly, grouped by what a
# merge touches, with majors apart so they never hold up the rest. The cooldown skips
# releases younger than a week; security updates ignore it. Not covered: mise.toml
# and mise.lock, the mise release in the toolchain action, and .tflint.hcl's ruleset.

version: 2

multi-ecosystem-groups:
  ci-tooling:
    schedule:
      interval: quarterly

updates:
  # / covers only the workflows and a root action.yml.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    patterns: ["*"]
    multi-ecosystem-group: ci-tooling
    cooldown:
      default-days: 7

  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: ci-tooling
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # They define the pipeline's version, which the published exports record.
      - dependency-name: duckdb
      - dependency-name: dbt-*
      # Only the published analysis uses them, and a major can change its results.
      - dependency-name: matplotlib
        update-types: ["version-update:semver-major"]
      - dependency-name: plotnine
        update-types: ["version-update:semver-major"]
      - dependency-name: polars
        update-types: ["version-update:semver-major"]
      - dependency-name: pyarrow
        update-types: ["version-update:semver-major"]
      - dependency-name: scikit-learn
        update-types: ["version-update:semver-major"]
      # Its 2.x sends an API version that refuses the temperature every call
      # sends, and no CI job calls the model; #173 lifts this with the bound.
      - dependency-name: anthropic
        update-types: ["version-update:semver-major"]
    groups:
      python-runtime:
        patterns:
          - ag-ui-*
          - anthropic
          - aws-opentelemetry-distro
          - bedrock-agentcore
          - boto3*
          - fastapi
          - httpx
          - jsonschema
          - langchain*
          - langgraph*
          - opentelemetry-*
          - rfc3339-validator
        update-types: [minor, patch]
      # Dependabot reads no locked version for a name with extras (dependabot-core#16431) or for the build
      # backend, and a group with update-types turns such a dependency away, so these get one without.
      python-unversioned:
        patterns:
          - "boto3[crt]"
          - "boto3-stubs[cognito-idp,dynamodb,logs,s3,secretsmanager,ssm,sts]"
          - "moto[cognitoidp,dynamodb,s3]"
          - uv-build
      python-tooling:
        patterns: ["*"]
        update-types: [minor, patch]
      python-major:
        patterns: ["*"]
        update-types: [major]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # Its types follow the Node major in mise.toml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 replaces the compiler; we stay on 6.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web-app:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      web-tooling:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
      web-major:
        patterns: ["*"]
        update-types: [major]
      web-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: [/infra, /infra/iam]
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]
