name: Deploy · Prototype

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/iam/**"
      - "!infra/dataset/**"
      - "src/**"
      - "web/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/toolchain/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-prototype.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/iam/**"
      - "!infra/dataset/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/toolchain/**"
      - ".github/workflows/deploy-prototype.yml"
  workflow_dispatch:

permissions: {}

# bash adds pipefail, so `make plan | tee` fails when the plan does.
defaults:
  run:
    shell: bash

env:
  ENV: prototype
  AWS_REGION: us-east-1

jobs:
  # Read-only role and no state lock, so a plan never blocks an apply.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AWS_ROLE_ARN_PROTOTYPE_PLAN != ''
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    concurrency:
      group: deploy-prototype-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Full history, for the build's commit stamp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/toolchain
        with:
          tools: python uv terraform

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROTOTYPE_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: terraform -chdir=infra fmt -check -recursive
      - run: make init ENV=${{ env.ENV }}

      - name: Plan
        id: plan
        env:
          TF_CLI_ARGS_plan: -no-color -lock=false
        run: make plan ENV=${{ env.ENV }} 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Capture plan output
        if: always()
        id: planfile
        run: |
          {
            echo 'value<<EOF'
            head -c 60000 plan.txt
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan
        if: always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terraform-plan-prototype
          message: |
            #### Terraform Plan · `prototype` ${{ steps.plan.outcome == 'success' && '✅' || '❌' }}
            <details><summary>Show plan</summary>

            ~~~
            ${{ steps.planfile.outputs.value }}
            ~~~
            </details>

      - if: steps.plan.outcome == 'failure'
        run: exit 1

  # Applies queue instead of cancelling.
  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.AWS_ROLE_ARN_PROTOTYPE != ''
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prototype-apply
      cancel-in-progress: false
    # The submission's link.
    environment:
      name: prototype
      url: ${{ steps.site.outputs.url }}
    steps:
      # Full history, for the build's commit stamp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/toolchain
        with:
          tools: python uv terraform node pnpm

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROTOTYPE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: make init ENV=${{ env.ENV }}
      - run: make build

      - name: Apply
        run: |
          terraform -chdir=infra apply -auto-approve \
            -var-file=envs/${{ env.ENV }}.tfvars

      # After the apply, beside the config.json it wrote.
      - name: Deploy the site
        id: site
        run: |
          pnpm --dir web install --frozen-lockfile
          make site ENV=${{ env.ENV }} I_KNOW=1
          echo "url=$(jq -r .site.value.url build/${{ env.ENV }}.outputs.json)" >> "$GITHUB_OUTPUT"
