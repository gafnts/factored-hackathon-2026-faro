name: Deploy · Prototype

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/iam/**"
      - "!infra/dataset/**"
      - "src/**"
      - "web/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/toolchain/**"
      - "pyproject.toml"
      - "uv.lock"
      - "CHANGELOG.md"
      - ".github/workflows/deploy-prototype.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/iam/**"
      - "!infra/dataset/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/toolchain/**"
      - "CHANGELOG.md"
      - ".github/workflows/deploy-prototype.yml"
  workflow_dispatch:

permissions: {}

# bash adds pipefail, so `make plan | tee` fails when the plan does.
defaults:
  run:
    shell: bash

env:
  ENV: prototype
  AWS_REGION: us-east-1

# A push to a PR cancels its plan; runs on main queue, so a check never overlaps the next deploy.
concurrency:
  group: deploy-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each step holds only what it needs (ADR-0009): the build no credentials, the plan and the apply a role but no
# build tools, the comment no AWS credentials, and the check only the smoke user's password.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      # Full history, for the build's commit stamp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/toolchain
        with:
          tools: python uv node pnpm

      - run: make build

      # Terraform reads the committed copy, so the build must not change it.
      - name: Check the Gateway's tools against the contract
        run: git diff --exit-code infra/modules/gateway/tools.json

      - run: pnpm --dir web install --frozen-lockfile
      - run: make web

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            build/*.zip
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: web/dist
          if-no-files-found: error
          retention-days: 7

      # make release lists the sums in the release's notes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums
          path: build/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  # Read-only role and no state lock, so a plan never blocks an apply.
  plan:
    name: Plan
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AWS_ROLE_ARN_PROTOTYPE_PLAN != ''
    permissions:
      id-token: write # To assume the read-only plan role
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/toolchain
        with:
          tools: terraform

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROTOTYPE_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: terraform -chdir=infra fmt -check -recursive
      - run: make init ENV="${ENV}"

      - name: Plan
        id: plan
        env:
          TF_CLI_ARGS_plan: -no-color -lock=false
        run: make plan ENV="${ENV}" BUILT=1 2>&1 | tee plan.txt
        continue-on-error: true

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: plan.txt
          if-no-files-found: ignore
          retention-days: 7

      - if: steps.plan.outcome == 'failure'
        run: exit 1

  # The comment action is third-party, so it runs where no AWS role can be assumed.
  comment:
    name: Comment the plan
    needs: plan
    runs-on: ubuntu-latest
    if: always() && (needs.plan.result == 'success' || needs.plan.result == 'failure')
    permissions:
      pull-requests: write # To post and update the plan's comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
        continue-on-error: true

      - name: Capture plan output
        id: planfile
        run: |
          {
            echo 'value<<EOF'
            if [[ -f plan.txt ]]; then head -c 60000 plan.txt; else echo "The plan job stopped before planning; its log says why."; fi
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terraform-plan-prototype
          message: |
            #### Terraform Plan · `prototype` ${{ needs.plan.result == 'success' && '✅' || '❌' }}
            <details><summary>Show plan</summary>

            ~~~
            ${{ steps.planfile.outputs.value }}
            ~~~
            </details>

  apply:
    name: Apply
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.AWS_ROLE_ARN_PROTOTYPE != ''
    permissions:
      id-token: write # To assume the deploy role
      contents: read
    # The submission's link.
    environment:
      name: prototype
      url: ${{ steps.site.outputs.url }}
    outputs:
      url: ${{ steps.site.outputs.url }}
      gateway: ${{ steps.site.outputs.gateway }}
      target: ${{ steps.site.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/toolchain
        with:
          tools: terraform

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: web/dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROTOTYPE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: make init ENV="${ENV}"

      - name: Apply
        run: |
          terraform -chdir=infra apply -auto-approve \
            -var-file="envs/${ENV}.tfvars"

      # After the apply, beside the config.json it wrote.
      - name: Deploy the site
        id: site
        run: |
          make upload ENV="${ENV}" I_KNOW=1
          outputs="build/${ENV}.outputs.json"
          {
            echo "url=$(jq -r .site.value.url "${outputs}")"
            echo "gateway=$(jq -r .gateway_url.value "${outputs}")"
            echo "target=$(jq -r .gateway_targets.value.list_cards "${outputs}")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the deployed code against the build
        run: make verify ENV="${ENV}"

  # The environment holds the smoke user's password, and the deploy role trusts this environment's runs, so the job
  # gets no id-token: write and can't assume the role.
  check:
    name: Check
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: prototype
      url: ${{ needs.apply.outputs.url }}
    steps:
      - name: Skip without a smoke user
        if: vars.SMOKE_USERNAME == ''
        run: echo "::notice title=Deploy unchecked::prototype has no smoke user; CONTRIBUTING says how to set one up."

      - if: vars.SMOKE_USERNAME != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: vars.SMOKE_USERNAME != ''
        uses: $/.github/actions/toolchain
        with:
          tools: python uv

      - name: Install the dependencies and Chromium
        if: vars.SMOKE_USERNAME != ''
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Check the deploy as a customer
        if: vars.SMOKE_USERNAME != ''
        env:
          SMOKE_SITE: ${{ needs.apply.outputs.url }}
          SMOKE_GATEWAY_URL: ${{ needs.apply.outputs.gateway }}
          SMOKE_LIST_CARDS_TARGET: ${{ needs.apply.outputs.target }}
          SMOKE_USERNAME: ${{ vars.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: make smoke ENV="${ENV}"
