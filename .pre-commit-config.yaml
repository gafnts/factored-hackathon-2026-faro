default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^docs/analysis/figures/.*\.svg$
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        # dataset.lock is about 1.5 MB, one line per dataset file; slides.pdf is the submission's deck.
        exclude: ^(dataset\.lock|docs/slides\.pdf)$
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 443ffdff1cc1663b701ae73e7459029fe883455a # frozen: v1.109.3
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false
          - --env-vars=AWS_REGION=us-east-1
          # Parallel inits can collide on the provider cache CI sets.
          - --hook-config=--retry-once-with-cleanup=true
        stages: [pre-push]
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_trivy
        stages: [pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
      # The upstream hook scans staged changes only, which in CI is nothing.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full history)
        entry: gitleaks git --redact --verbose
        stages: [pre-push]
        always_run: true

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        # It doesn't know GitHub's $/ syntax, an action from the commit being run, yet.
        args: [-ignore, 'specifying action "\$/']

  - repo: local
    hooks:
      # Its online audits need GH_TOKEN; without one it runs the offline ones.
      - id: zizmor
        name: zizmor
        entry: uv run zizmor .github
        language: system
        files: ^\.github/
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: uv run shellcheck -x
        language: system
        types: [shell]

      - id: pyproject-fmt
        name: pyproject-fmt
        entry: uv run pyproject-fmt
        language: system
        files: pyproject\.toml$

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        language: system
        types: [python]
        entry: uv run pytest -n auto --cov --cov-report=term-missing
        pass_filenames: false
        stages: [pre-push]

      - id: prettier
        name: prettier (web)
        entry: web/node_modules/.bin/prettier --write --ignore-unknown --ignore-path web/.prettierignore
        language: system
        files: ^web/

      - id: eslint
        name: eslint (web)
        entry: web/node_modules/.bin/eslint --fix
        language: system
        files: ^web/.*\.(js|ts|tsx)$

      - id: tsc
        name: tsc (web)
        entry: pnpm --dir web typecheck
        language: system
        files: ^(web/|src/faro/contracts/)
        pass_filenames: false

      - id: vitest
        name: vitest (web)
        entry: pnpm --dir web test
        language: system
        files: ^(web/|src/faro/contracts/)
        pass_filenames: false
        stages: [pre-push]

      - id: vite-build
        name: vite build (web)
        entry: pnpm --dir web build
        language: system
        files: ^web/
        pass_filenames: false
        stages: [pre-push]
